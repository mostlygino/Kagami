name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Wireshark tools
        # tshark, sharkd and dftest; the tests read synthetic fixtures with them.
        run: brew install --cask wireshark

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: CLI and MCP checks
        run: scripts/check-cli.sh

      - name: App bundle
        run: ./make-app.sh
